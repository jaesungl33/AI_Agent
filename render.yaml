services:
  - type: web
    name: ai-agent-rag-backend
    runtime: python3
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn backend.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_DB_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: QWEN_API_KEY
        sync: false
      - key: DEBUG
        value: false
      - key: PORT
        value: 10000

  - type: pserv
    name: ai-agent-frontend
    runtime: node
    buildCommand: "npm install && npm run build"
    startCommand: "npm start"
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://ai-agent-rag-backend.onrender.com

databases:
  - name: ai-agent-db
    databaseName: ai_agent
    user: ai_agent_user